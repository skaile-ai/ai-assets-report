<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Theme: the brand's tokens, written by build.py from brands/<name>.json. Badges pick a colour token by name. */
{{THEME}}
:root{--fs-xs:12px;--fs-s:14px;--fs-m:15px;--fs-b:17px;--fs-l:21px;--fs-xl:28px;--fs-xxl:36px}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font:var(--fs-b)/1.65 var(--sans);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
::selection{background:var(--acc);color:#fff}
body{max-width:1180px;margin:0 auto;padding:56px 32px 96px}
a{color:var(--acc);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}a:hover{text-decoration-color:currentColor}
header{border-bottom:1px solid var(--ink);padding-bottom:20px;display:grid;grid-template-columns:1fr auto;gap:8px 32px;align-items:end}
header .brand{display:block;grid-column:1/-1;height:28px;width:auto}
h1,h2,h3{font-family:var(--head)}
h1{font-size:var(--fs-xxl);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
svg.ic{width:1em;height:1em;flex:none;vertical-align:-.125em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sources and run details: the summary sits at the end of the title row; the open panel floats over the page below it, so opening it never moves the title */
header .provenance{position:relative;justify-self:end;color:var(--mute);font-size:var(--fs-xs);text-align:right}
header .provenance summary{display:inline-block;list-style:none;cursor:pointer;border-radius:3px}
header .provenance summary::-webkit-details-marker{display:none}
header .provenance summary::before{content:"";display:inline-block;width:1em;height:1em;margin-right:3px;vertical-align:-.15em;background:currentColor;-webkit-mask:var(--ic-chevron-right) center/contain no-repeat;mask:var(--ic-chevron-right) center/contain no-repeat}
header .provenance[open]>summary::before{-webkit-mask-image:var(--ic-chevron-down);mask-image:var(--ic-chevron-down)}
header .provenance summary:hover{color:var(--ink)}
header .provenance summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header .provenance p,header .prov-print{margin:6px 0 0;overflow-wrap:anywhere}
header .provenance>p{position:absolute;z-index:15;top:100%;right:0;width:max-content;max-width:min(520px,calc(100vw - 36px));padding:12px 14px;text-align:left;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;box-shadow:0 4px 16px rgb(0 0 0/.1)}
@media(max-width:640px){header .provenance{justify-self:start}header .provenance>p{right:auto;left:0}}
header .prov-print{display:none;color:var(--mute);font-size:var(--fs-xs);text-align:left}
dl.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:0;border-bottom:1px solid var(--rule)}
/* values share the bottom of each cell: a label that wraps to two lines grows its cell, not the value's position */
dl.stats div{display:flex;flex-direction:column;padding:14px 12px;border-right:1px solid var(--hair)}dl.stats div:last-child{border:0}
dl.stats dt{font-size:var(--fs-xs);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
dl.stats dd{margin:auto 0 0;padding-top:2px;font-size:var(--fs-l);font-weight:500;font-variant-numeric:tabular-nums}
main>section{display:block;padding:44px 0 40px;scroll-margin-top:16px;border-bottom:1px solid var(--rule)}
main>section.lede{padding-top:8px}
section>h2{font-size:var(--fs-xl);font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0 0 18px;padding-top:12px;border-top:3px solid var(--ink)}
.sn{font:500 var(--fs-l)/1 var(--mono);color:var(--mute);margin-right:.5em}
.ha{margin-left:.4em;color:var(--mute);text-decoration:none;opacity:0}h2:hover>.ha,.ha:focus-visible{opacity:1}
@media(hover:none){.ha{opacity:1}}
/* chapter label: a divider that opens a group of sections (label, then a rule running out to the right), clear of the h2 below; not a kicker on one heading */
.chap{display:flex;align-items:center;gap:16px;font:600 var(--fs-m)/1.3 var(--sans);color:var(--ink);margin:0 0 -12px;padding:48px 0 0}
.chap::after{content:"";flex:1;border-top:1px solid var(--rule)}
.lede .body p{font-size:var(--fs-l);line-height:1.5}
/* a group head carries its space as padding: a margin at the top of a column is dropped, which set the two column heads apart */
nav.toc .toc-g{padding-top:8px}nav.toc .toc-g>span{display:block;font-weight:600}nav.toc .toc-g ol{columns:1}
.body>*:first-child{margin-top:0}
p,ul.ste li,ol.ste li{max-width:36em;overflow-wrap:anywhere}
p,li,figcaption{text-wrap:pretty}h1,h2,h3{text-wrap:balance}
ul.ste,ol.ste{padding-left:1.2em;margin:0 0 16px}ul.ste li,ol.ste li{margin:.35em 0}ol.ste li::marker{font-size:var(--fs-xs);color:var(--mute)}
code{font-size:var(--fs-m);background:var(--wash);padding:0 4px;border-radius:3px}
td code,th code,.tree code,.mt code,.tp>.sum code{font-size:var(--fs-s)}
figcaption code,.lg code,details.notes code,.notes-1 code,.xr code,.src code{font-size:var(--fs-xs)}
.src{color:var(--mute);font-size:var(--fs-xs);white-space:normal;overflow-wrap:anywhere}
/* diagrams: natural size inside a scroll container, like tables */
.fg{margin:8px 0 28px;padding:4px 0;scroll-margin-top:80px;border-radius:6px;transition:background 1.5s}
.fg>figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:var(--fs-s);color:var(--mute);margin:0 0 8px}
.fg>figcaption b{color:var(--ink);font-weight:600}
.lvl{font-size:var(--fs-xs);font-weight:600;line-height:1.6;padding:0 5px;border:1px solid var(--ink);color:var(--ink)}
.dw{overflow-x:auto;padding:2px 0}
/* row under the frame: "scroll sideways" hint (dwCue shows it only while the frame overflows) and the ⤢ zoom button at the right */
.fgb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:4px 0 0}.fgb:not(:has(>:not([hidden]))),html:not(.js) .fgb{display:none}
.dwh{font-size:var(--fs-xs);color:var(--mute)}@media print{.fgb{display:none}}
.dg{display:block;max-width:none;color:var(--ink)}.dg text{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
pre.mermaid{font:var(--fs-xs) var(--mono);white-space:pre;overflow-x:auto;margin:0}pre.mermaid[data-processed] svg{max-width:100%;height:auto}
.vg{width:100%;min-width:0}.vg .vega-embed{width:100%;display:flex}.vg .vega-embed>svg{max-width:100%}
.bx{fill:var(--paper);stroke:var(--ink);stroke-width:1;transition:fill 1.5s}
.bx.ext{fill:var(--wash);stroke:var(--mute)}.bx.bd{fill:var(--wash);stroke:var(--mute);stroke-dasharray:4 3}
.bt{font:600 13px var(--mono);fill:var(--ink)}.bs{font:12px var(--mono);fill:var(--mute)}
.ln{fill:none;stroke:var(--ink);stroke-width:1}.ln.error{stroke:var(--red);stroke-dasharray:5 3}.ln.opt{stroke:var(--mute);stroke-dasharray:2 3}
.mk{fill:none;stroke:var(--ink);stroke-width:1.2}.mk.error{stroke:var(--red)}.mk.opt{stroke:var(--mute)}
.el{font:var(--fs-xs) var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}.el.error{fill:var(--red)}
/* declared edge kinds (`kinds`): colour token in --k, dash by class */
.ln.ck{stroke:var(--k);stroke-width:1.4}.ln.ck.dash{stroke-dasharray:6 4}.ln.ck.dot{stroke-dasharray:2 3}.mk.ck{stroke:var(--k)}.el.ck{fill:var(--k)}
.pd{fill:var(--ink)}.pf{fill:none;stroke:var(--ink);stroke-width:1.2}
.dz{fill:var(--paper);stroke:var(--ink);stroke-width:1}.dzp{stroke:var(--ink);stroke-width:1.2}
a.dgl{text-decoration:none}a.dgl:hover .bx{stroke-width:2.4}
.nd.hit .bx{fill:var(--hl)!important;stroke-width:2.4}.fg.hit{background:var(--hl)}
.lg{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:var(--fs-xs);color:var(--mute);margin:8px 0 0}.lg span{display:inline-flex;align-items:center;gap:5px}.lg svg{flex:none}
details.ev{margin:6px 0 0;font-size:var(--fs-xs)}details.ev summary{cursor:pointer;color:var(--mute)}details.ev table{margin-top:4px}
.fg>.tw{margin-top:12px}
/* diagram interaction: hover/focus keeps a node's edges and neighbours, kind toggles, zoom view */
.dg .nd,.dg .ln,.dg .el,.dg .ah,.dg .ml{transition:opacity .15s}
.dg.focus .nd:not(.on),.dg.focus .ln:not(.on),.dg.focus .el:not(.on),.dg.focus .ah:not(.on),.dg.focus .ml:not(.on){opacity:.12}.dg.focus .on{opacity:1}
.dg.focus .ln.on{stroke-width:2}.dg.focus .el.on{font-weight:600}
.kh,.mp .fh{display:none}.nd.iso{opacity:.3}
/* filtered by a driving tree: faded, and out of the hover focus */
.dg .fx,.dg.focus .fx.on{opacity:.12}
/* legend toggles: quiet outlined pills so they read as switches; off = dashed, faded and struck through */
.lg:has(.lk){gap:6px 8px}
.lg .lk{display:inline-flex;align-items:center;gap:5px;min-height:24px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:0 9px 0 7px;cursor:pointer}
.lg .lk:hover{background:var(--wash);border-color:var(--mute)}.lg .lk:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.lg .lk[aria-pressed=false]{color:var(--mute);background:none;border-style:dashed;text-decoration:line-through}.lg .lk[aria-pressed=false] svg{opacity:.35}
.zb{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:var(--fs-s)/1.4 var(--mono);padding:0 8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--ink)}.zb:hover{background:var(--wash)}
/* the ⤢ glyph alone means little on a phone: touch screens get the word too */
.zbt{display:none;font-family:var(--sans)}@media(pointer:coarse),(max-width:800px){.zbt{display:inline}}
html:not(.js) .zb{display:none}
.zv{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--paper);color:var(--ink);font:var(--fs-s)/1.5 var(--mono)}
.zv[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.zv::backdrop{background:var(--paper)}
.zt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 14px;border-bottom:1px solid var(--ink)}
.zt b{font-weight:600}.zh{color:var(--mute);font-size:var(--fs-xs)}.zt span:last-child{margin-left:auto;display:flex;gap:6px}
.zt button{font:var(--fs-xs) var(--mono);min-width:30px;padding:3px 8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--ink)}
.zc{overflow:hidden;touch-action:none;cursor:grab}.zc.drag{cursor:grabbing}.zc svg.dg{width:100%;height:100%}
.zl{padding:6px 14px 10px;border-top:1px solid var(--hair)}.zl .lg{margin:0}
@media(max-width:800px){.zh{display:none}}
/* map: boxes the reader drags and greys out, curved edges, labels as pills or dots (`map` block) */
.mw{border:1px solid var(--hair);border-radius:6px;overflow:hidden;touch-action:none;background:var(--paper)}
.mw svg.mp{width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}.mw.drag svg.mp{cursor:grabbing}
.mn{cursor:pointer}.mn:focus{outline:none}.mn:focus-visible .bx{stroke:var(--acc)!important;stroke-width:2.4}.mn:hover .bx{stroke-width:2}
.bl{font:var(--fs-xs) var(--mono);fill:var(--ink)}
.mlk{font:var(--fs-s) var(--mono);fill:var(--acc)}.mla:hover .mlk{font-weight:700}
.mn.off .bx{fill:var(--wash)!important;stroke:var(--rule)!important}.mn.off text{fill:var(--mute);opacity:.6}
.ln.off,.ln.ck.off{stroke:var(--rule)}.ah{fill:var(--ink);stroke:none}.ah.error{fill:var(--red)}.ah.opt{fill:var(--mute)}.ah.ck{fill:var(--k)}.ah.off{fill:var(--rule)}
.ml{color:var(--ink)}.ml.ck{color:var(--k)}.ml.error,.ml.wr{color:var(--red)}.ml.opt{color:var(--mute)}.ml.off{color:var(--rule)}
.ml rect{fill:var(--paper);stroke:currentColor}.ml.wr:not(.off) rect{fill:var(--red-bg)}.ml text{font:var(--fs-xs) var(--mono);fill:currentColor}.ml.off text{fill:var(--mute)}.mld{fill:currentColor}
.ml.dt .mlp,.ml:not(.dt) .mld,.dg.focus .ml.dt.on .mld{display:none}.dg.focus .ml.dt.on .mlp{display:inline}
.mtb{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}.mc{color:var(--mute);font-size:var(--fs-xs)}
.mtb button{font:var(--fs-xs) var(--mono);padding:1px 8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--ink)}
.mtb button:hover{background:var(--wash)}.mtb button:disabled{opacity:.4;cursor:default}html:not(.js) .mtb{display:none}
.mh{font-size:var(--fs-xs);color:var(--mute);margin:4px 0 0;max-width:none}
.fg:fullscreen{background:var(--paper);padding:12px 16px;display:flex;flex-direction:column;overflow:auto}.fg:fullscreen>.dw{flex:1;min-height:0}
.fg:fullscreen .mw{height:100%!important;max-height:none!important;aspect-ratio:auto!important}
.vch{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.25rem 1rem}.vch button{font:inherit;background:none;border:0;padding:0;color:var(--acc);cursor:pointer}.vch button:hover{text-decoration:underline}.vch .t{color:var(--mute);margin-right:.4em;font-variant-numeric:tabular-nums}
/* board: moodboard canvas (`board` block). The read layout is the default (no JS, print, narrow screens): canvases, lanes
   and gutters stack in page flow. .bo-cv (set by boardInit) is canvas mode: one canvas on a dot grid under a CSS camera. */
.bo{--bo-paper:#f6f4ee;--bo-dot:#cfc9bb;--bo-move:#ffd54a;--bo-move-ink:#5a4300;--bo-new:#a6e9a0;--bo-new-ink:#14501a}
.bov{border:1px solid var(--rule);border-radius:10px;background:var(--bo-paper);padding:12px}
.bov:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.boc{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px;margin:0 0 16px;scroll-margin-top:80px}.boc:last-child{margin-bottom:0}
.boh h3{font-size:var(--fs-l);line-height:1.25;letter-spacing:-.01em;margin:0 0 6px}.boh-l{margin:0}
.bol{margin:16px 0 0;min-width:0}
.bol-l,.bou-l{font:600 var(--fs-xs)/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.bol-proposed>.bol-l{color:var(--bo-new-ink)}
.bog{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.bok{min-width:0;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);scroll-margin-top:80px;overflow-wrap:anywhere;transition:background 1.5s}
.bok>*{margin:0 0 8px}.bok>*:last-child{margin-bottom:0}.bok p,.bok li{max-width:none}.bok .fg{margin:0 0 8px}.bok table{font-size:var(--fs-s)}
.bok-k{font:500 var(--fs-xs)/1.5 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.bok-t{font-size:var(--fs-b);line-height:1.3;margin:0 0 6px}.bok-e{font-size:var(--fs-s)}.bok-at{font-size:var(--fs-s)}
.bok-m{display:flex;flex-wrap:wrap;gap:6px}
.bok.hit,.boc.hit{background:var(--hl)}
.boc:focus{outline:none}.bok:focus{outline:none}.bok:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.boi{margin:0}.boi-b{display:block;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--wash);cursor:zoom-in}
.boi img{display:block;width:100%;height:auto}.boi figcaption{font-size:var(--fs-xs);color:var(--mute);margin-top:4px}
/* marks: the highlighter look; the kind is printed, colour only backs it up */
.bom{display:inline-block;font:700 var(--fs-xs)/1.6 var(--mono);letter-spacing:.06em;padding:0 .5em;border:1.5px solid transparent;border-radius:3px;white-space:nowrap;max-width:100%}
.boq{font-weight:500;letter-spacing:0;white-space:normal}
.bom-move,.bom-merge{background:linear-gradient(100deg,transparent 2%,var(--bo-move) 4%,var(--bo-move) 96%,transparent 98%);color:var(--bo-move-ink);transform:rotate(-1deg)}
.bom-new{background:var(--bo-new);color:var(--bo-new-ink);transform:rotate(-1deg)}
.bom-reuse{border:1.5px dashed var(--blue);color:var(--blue)}.bom-keep{border-color:var(--ink);color:var(--ink)}
.bom-later{border:1.5px dashed var(--gray);color:var(--gray)}.bom-remove{background:var(--gray-bg);color:var(--gray);text-decoration:line-through}
.bom-optional{border-color:var(--green);color:var(--green)}
.bolg .bom{margin-right:2px}
/* gutter: what changes between a lane and the next */
.bou{margin:16px 0 0;padding:10px 12px;border:1px dashed var(--rule);border-radius:10px;background:var(--paper)}
.bou ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.boa{font-size:var(--fs-m);line-height:1.45;overflow-wrap:anywhere}.boa-r{display:block;font-size:var(--fs-s);color:var(--mute)}.boa-l{display:none}
.bok.chg,.boc.chg{border-color:var(--c);box-shadow:inset 3px 0 var(--c)}.bol.chg>.bol-l{color:var(--c)}.boa.chg{background:var(--cb);box-shadow:inset 3px 0 var(--c);padding-left:8px}
.bok.c-removed>.bok-t{text-decoration:line-through;text-decoration-color:var(--red)}
.bot select{font:var(--fs-xs) var(--mono);max-width:min(100%,300px);padding:1px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.bot output{min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.fg.bo .bot button[aria-pressed=true]{background:var(--ink);color:#fff}
.fg.bo:not(.bo-cv) .boz,.fg.bo:not(.bo-cv) .bohint{display:none}
@media screen{
 .bo-cv .bov{position:relative;height:var(--bo-h,640px);overflow:hidden;padding:0;touch-action:none;cursor:grab;
  background-image:radial-gradient(circle,var(--bo-dot) 1.3px,transparent 1.6px);background-size:24px 24px}
 .bo-cv .bov.drag{cursor:grabbing}
 .bo-cv .bow{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
 .bo-cv .boc{position:absolute;left:60px;top:60px;width:max-content;margin:0;padding:28px 30px;border-radius:20px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
 .bo-cv .boc:not(.on){display:none}
 .bo-cv .boh{max-width:1100px;margin:0 0 8px}.bo-cv .boh h3{font-size:var(--fs-xl)}
 .bo-cv .bor{display:flex;align-items:flex-start;gap:28px}
 .bo-cv .bol{flex:none;width:calc(var(--cols)*340px + (var(--cols) - 1)*18px);margin:0}
 .bo-cv .bog{grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:18px}
 .bo-cv .bou{flex:none;width:230px;margin:34px 0 0;padding:0 6px;border:0;background:none}.bo-cv .bou-l{text-align:center}
 .bo-cv .bou ol{gap:26px}.bo-cv .boa{position:relative;padding-bottom:16px;font-size:var(--fs-s)}
 .bo-cv .boa-l{display:block;position:absolute;left:-14px;right:-14px;bottom:0;height:12px;background:linear-gradient(var(--ink),var(--ink)) 0 50%/calc(100% - 12px) 2.5px no-repeat}
 .bo-cv .boa-l::after{content:"";position:absolute;right:0;top:0;border-left:13px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
 .fg.bo.bo-cv:fullscreen .bov{height:100%}
}
@media(max-width:640px){.boc{padding:12px}.bov{padding:8px}}
@media print{.fg.bo .bot,.fg.bo .bohint{display:none}.bow{transform:none!important}.bov{border:0;padding:0;background:none}.bok,.boa{break-inside:avoid}}
.bod{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--paper);color:var(--ink)}
.bod[open]{display:grid;grid-template-rows:auto minmax(0,1fr)}.bod::backdrop{background:var(--paper)}
.bod-h{display:flex;align-items:flex-start;gap:12px;padding:8px 14px;border-bottom:1px solid var(--ink)}
.bod-h div{flex:1;min-width:0}.bod-h b{display:block}.bod-h span{font-size:var(--fs-s);color:var(--mute);overflow-wrap:anywhere}
.bod-h button{font:var(--fs-s) var(--sans);min-height:44px;min-width:44px;padding:3px 12px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--ink)}
.bod-i{min-height:0;display:grid;place-items:center;padding:12px}.bod-i img{max-width:100%;max-height:100%;object-fit:contain;display:block}
/* tables and bars */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-m)}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--hair);vertical-align:baseline}
thead th{font:600 var(--fs-s) var(--sans);color:var(--mute);border-bottom:1px solid var(--ink)}
