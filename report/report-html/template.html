/* Theme: GitHub Primer Light. Every colour below is a token; badges pick one by name. */

li.d0{margin-top:16px}li.d0>.row{border-bottom:2px solid var(--lc,var(--ink));padding-bottom:6px}li.d0>.row .tt{font-size:15px;font-weight:700;color:var(--lc,var(--ink))}
li.has-kids>.row .tt{font-weight:600}li.muted>.row .tt{color:var(--mute);font-weight:400}
.grp:has(>.xr){white-space:normal;flex-wrap:wrap}.xr{font-size:12px;color:var(--mute)}.xr a{margin-right:2px}

tr{scroll-margin-top:80px}

<script>
/* One filter per tree. FILTER holds the toggleable categories of that tree. `drives`: figure ids of
   diagrams showing the same entities (node data-e); a map hides the filtered boxes, others fade them. */
function treeFilter(cats,label,drives=[]){return{off:{},v:{},count:'',q:'',shown:0,
 init(){(window.TF=window.TF||new Set()).add(this);this.recalc();window.addEventListener('hashchange',()=>this.reveal());this.$nextTick(()=>this.reveal())},
 t(k){this.off={...this.off,[k]:!this.off[k]};this.recalc()},
 reset(){this.off={};this.recalc()},
 recalc(){const o=this.off,q=this.q,v={};let shown=0,total=0;
  /* own: this node's badges pass; up: every ancestor's badges pass. */
  const walk=(li,up)=>{const vals=JSON.parse(li.dataset.b||'{}');let own=true;
   for(const c of cats){const a=vals[c.key]||[];if(!a.length)continue;
    own=own&&(c.mode==='hide'?!a.some(x=>o[c.key+':'+x]):a.some(x=>!o[c.key+':'+x]))}
   /* find box: a row matches by its own text; an ancestor of a match stays, a descendant of a match does not. */
   const hit=!q||li.querySelector(':scope>.row').textContent.toLowerCase().includes(q);
   const kids=[...li.querySelectorAll(':scope>ul>li')].map(k=>walk(k,up&&own));
   let ok=up&&own;
   if((kids.length&&!('leaf' in li.dataset))||!hit)ok=ok&&kids.some(Boolean);
   if('count' in li.dataset){total++;if(ok)shown++}
   v[li.dataset.id]=ok;return ok};
  this.$root.querySelectorAll('ul.tr>li').forEach(li=>walk(li,true));this.v=v;this.shown=shown;this.count=shown+' / '+total+' '+label;findN();

 box.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{FIND.q=box.value.trim().toLowerCase();
  for(const tf of window.TF||[]){tf.q=FIND.q;tf.recalc()}
  document.dispatchEvent(new CustomEvent('find',{detail:{q:FIND.q}}));findN()},120)})});
/* Data tables (`data` block). window.DT comes from a module script in <head> (simple-datatables, only when the report has a `data`
   block) and fires `dt-ready`; without it the plain tables stay. Each table.dt gets `el._dt` (the DataTable) and
   `el._dtFilter(col, values|null, source='filter')`: keep only rows whose cell text in column `col` equals one of `values`
   (exact match; null or [] removes that filter) — for a chart selection. Sources AND together; 'search' (the table's own box)
   and 'find' (the header box) match by substring. Counts (`FIND.parts.dt`) follow every change. CSV exports every row.
   `dt-init` fires on document once all tables are upgraded (a chart that listens to a table waits for it). */
const DTL={de:{placeholder:'Tabelle durchsuchen…',searchTitle:'In der Tabelle suchen',searchLabel:'Suchen',sortHint:'Zum Sortieren aktivieren',pageTitle:'Seite {page}',perPage:'Zeilen pro Seite',noRows:'Keine Zeilen',info:'Zeilen {start} bis {end} von {rows}',noResults:'Keine Zeile passt zur Suche'},
 en:{placeholder:'Search table…',searchTitle:'Search within table',searchLabel:'Search',sortHint:'Activate to sort',pageTitle:'Page {page}',perPage:'rows per page',noRows:'No rows',info:'Showing {start} to {end} of {rows} rows',noResults:'No row matches the search'}};
const dtAll=()=>[...document.querySelectorAll('table.dt')].filter(e=>e._dt);
function dtCount(){const t=dtAll();if(!t.length)return;
 FIND.parts.dt=t.reduce((s,e)=>s+(e._dt._searchQueries.length?e._dt._searchData.length:e._dt.data.data.length),0);findN()}
function dtInit(){if(!window.DT)return;const L=DTL[document.documentElement.lang.slice(0,2)]||DTL.en;
 const text=c=>(c.text??(typeof c.data==='string'?c.data:'')).trim();
 document.querySelectorAll('table.dt').forEach(el=>{if(el._dt)return;const c=JSON.parse(el.dataset.dt||'{}');
  const dt=new DT.DataTable(el,{searchable:true,perPage:c.page||25,perPageSelect:[10,25,50,100],labels:L,
   sensitivity:'variant',ignorePunctuation:false,
   searchMethod:(terms,cell,row,col,src)=>src==='search'||src==='find'?terms.some(t=>text(cell).toLowerCase().includes(t.toLowerCase())):terms.includes(text(cell)),
   columns:(c.num||[]).length?[{select:c.num,type:'number'}]:[]});
  el._dt=dt;
  el._dtFilter=(col,values,src='filter')=>dt.multiSearch(values&&values.length?[{terms:values.map(String),columns:[col]}]:[],src);
  dt.on('datatable.multisearch',dtCount);
  dt.on('datatable.init',()=>{if(FIND.q)dt.multiSearch([{terms:[FIND.q]}],'find');dtCount()});
  document.querySelectorAll(`button.csv[data-dt="${CSS.escape(el.id.slice(3))}"]`).forEach(b=>b.hidden=false)});
 document.dispatchEvent(new Event('dt-init'))}
addEventListener('dt-ready',dtInit);
addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button.csv');if(!b)return;
 const el=document.getElementById('dt-'+b.dataset.dt);if(el&&el._dt)DT.exportCSV(el._dt,{download:true,filename:b.dataset.dt})});
document.addEventListener('find',()=>{for(const e of dtAll())e._dt.multiSearch(FIND.q?[{terms:[FIND.q]}]:[],'find');dtCount()});
/* Vega-Lite charts (`vega` block). vega, vega-lite and vega-embed are `defer` scripts in <head> (only when the report has a `vega`
   block), so they exist at DOMContentLoaded. Per chart: el._view (Vega view), el._rows (the inline rows, dataset `rows`).
   Chart -> table: a table.dt whose data-dt.listen.chart is this chart gets the point selection of `listen.param` as an exact filter
   on column `listen.col` (field values read from the signal `{field:[values]}`, else from the `<param>_store` tuples).
   Tree -> chart: `drives` sets fig._hide (entity ids) and fires `treefilter`; the rows of those ids leave the dataset. */
function vgPick(v,l){let vals=null;
 try{const s=v.signal(l.param);if(s&&Array.isArray(s[l.field]))vals=s[l.field]}catch(_){}
 if(!vals){vals=[];try{for(const t of v.data(l.param+'_store')||[]){
   const i=(t.fields||[]).findIndex(f=>(f&&f.field||f)===l.field);if(i>=0&&t.values&&t.values[i]!=null)vals.push(t.values[i])}}catch(_){}}
 return vals.map(String)}
function vgLink(){for(const el of document.querySelectorAll('.vg')){const v=el._view;if(!v)continue;const id=el.id.slice(3);el._lk=el._lk||new Set();
 for(const t of dtAll()){const l=JSON.parse(t.dataset.dt||'{}').listen;if(!l||l.chart!==id||el._lk.has(t.id))continue;el._lk.add(t.id);
  v.addSignalListener(l.param,()=>t._dtFilter(l.col,vgPick(v,l),'chart'))}}}
/* Vega-Lite clears a point selection only on dblclick. A click on empty chart area (no mark item, or an axis/title item) must also clear
   it: reset every point param's `<param>_store` dataset (the selection test of the mark encodings reads it, so the highlight resets),
   then reset the listening tables by hand. The signal listener above does not fire for this: the param signal depends on
   `<param>_modify`, not on the store, so the store reset leaves it stale. A mark item with a datum (a bar) is left to Vega-Lite:
   its own click handler selects it, a second bar replaces the selection, shift-click adds. */
function vgPoints(spec){const n=new Set(),walk=o=>{if(!o||typeof o!=='object')return;
  if(Array.isArray(o.params))for(const p of o.params){const s=p&&p.select;if(s&&(s==='point'||s.type==='point'))n.add(p.name)}
  for(const k of ['layer','concat','hconcat','vconcat'])if(Array.isArray(o[k]))o[k].forEach(walk);if(o.spec)walk(o.spec)};
 walk(spec);return [...n]}
function vgClear(el,spec){const v=el._view,id=el.id.slice(3),pts=vgPoints(spec);if(!v||!pts.length)return;
 v.addEventListener('click',(ev,item)=>{
  if(item&&item.datum&&!/^(axis|title)/.test(item.mark&&item.mark.role||''))return;
  const cl=pts.filter(p=>{try{return(v.data(p+'_store')||[]).length}catch(_){return false}});if(!cl.length)return;
  for(const p of cl)v.data(p+'_store',[]);
  v.runAsync().then(()=>{for(const t of dtAll()){const l=JSON.parse(t.dataset.dt||'{}').listen;
   if(l&&l.chart===id&&cl.includes(l.param))t._dtFilter(l.col,null,'chart')}})})}
function vgFilter(fig,el){const v=el._view,ent=fig.dataset.e;if(!v||!ent||!fig._hide)return;const h=fig._hide;
 v.change('rows',(window.vega||vegaEmbed.vega).changeset().remove(()=>true).insert(el._rows.filter(r=>!h.has(String(r[ent]))).map(r=>({...r})))).run()}
function vgInit(){document.querySelectorAll('.vg').forEach(el=>{if(el._view||el._busy)return;el._busy=true;
  const fig=el.closest('.fg'),sc=el.parentNode.querySelector('script.vgs');
  const bad=()=>{el.textContent='';const p=document.createElement('p');p.className='mt';p.textContent=el.dataset.nocdn||'';el.appendChild(p)};
  if(typeof vegaEmbed==='undefined'||!sc){bad();return}
  let spec;try{spec=JSON.parse(sc.textContent)}catch(_){bad();return}
  el._rows=spec.data.values;
  fig.addEventListener('treefilter',()=>vgFilter(fig,el));
  vegaEmbed(el,spec,{actions:false,renderer:'svg',config:{font:'JetBrains Mono, monospace',axis:{labelColor:'#59636e'}}})
   .then(r=>{el._view=r.view;vgClear(el,spec);vgFilter(fig,el);vgLink()}).catch(bad)})}
addEventListener('DOMContentLoaded',vgInit);
document.addEventListener('dt-init',vgLink);
